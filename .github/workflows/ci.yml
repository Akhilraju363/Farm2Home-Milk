name: CI

# Validates every pull request and every push to main.
# Backend and frontend run as independent parallel jobs.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR. Pushes to main are allowed to
# run to completion (each main commit is a release candidate for the Docker workflow).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write        # dorny/test-reporter publishes a check run
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit tests, Testcontainers-backed integration tests (*IntegrationTest,
      # *ApplicationTests — Docker is available on ubuntu-latest runners) and the
      # JaCoCo coverage gate declared in backend/pom.xml all run under `verify`.
      - name: Build, test and verify
        working-directory: backend
        run: mvn -B --no-transfer-progress clean verify

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: ${{ !cancelled() }}
        with:
          name: Backend test results
          path: 'backend/**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload test & coverage artifacts
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: backend-reports
          path: |
            backend/**/target/surefire-reports/**
            backend/**/target/failsafe-reports/**
            backend/**/target/site/jacoco/**
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend (React / TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
