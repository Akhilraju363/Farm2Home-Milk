server:
  port: 8085

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/farm2home?currentSchema=payment
    username: farm2home
    password: farm2home@123
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: payment
  flyway:
    enabled: true
    schemas: payment
    create-schemas: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092

payment:
  gateway:
    # mock (default, no external calls/credentials — used for local dev and every test) | razorpay
    provider: ${PAYMENT_GATEWAY_PROVIDER:mock}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com/v1}
      currency: ${RAZORPAY_CURRENCY:INR}
    reconciliation:
      enabled: ${PAYMENT_RECONCILIATION_ENABLED:true}
      interval-ms: ${PAYMENT_RECONCILIATION_INTERVAL_MS:300000}
      stale-after-minutes: ${PAYMENT_RECONCILIATION_STALE_MINUTES:5}

farm2home:
  payment:
    # The legacy POST /payments/callback updates payment state with NO signature/secret
    # verification. Disabled (endpoint returns 404) unless explicitly turned on for local dev /
    # test against the mock provider. MUST stay false in every deployed environment - real
    # gateway outcomes arrive via POST /{id}/verify or the HMAC-verified POST /webhook.
    legacy-callback-enabled: ${PAYMENT_LEGACY_CALLBACK_ENABLED:false}

eureka:
  client:
    service-url:
      defaultZone: http://eureka:eurekaSecret@localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.farm2home.payment: DEBUG
