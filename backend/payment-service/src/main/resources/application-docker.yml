spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/farm2home?currentSchema=payment
    username: ${DB_USERNAME:farm2home}
    password: ${DB_PASSWORD:farm2home@123}
  flyway:
    schemas: payment
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

payment:
  gateway:
    provider: ${PAYMENT_GATEWAY_PROVIDER:mock}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com/v1}
      currency: ${RAZORPAY_CURRENCY:INR}
    reconciliation:
      enabled: ${PAYMENT_RECONCILIATION_ENABLED:true}
      interval-ms: ${PAYMENT_RECONCILIATION_INTERVAL_MS:300000}
      stale-after-minutes: ${PAYMENT_RECONCILIATION_STALE_MINUTES:5}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://eureka:eurekaSecret@discovery-service:8761/eureka}

configserver:
  health:
    url: http://config-server:8888

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env

logging:
  level:
    com.farm2home: INFO
