server:
  port: 8083

spring:
  application:
    name: subscription-service
  datasource:
    url: jdbc:postgresql://localhost:5432/farm2home?currentSchema=subscription
    username: farm2home
    password: farm2home@123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: subscription
        format_sql: true
  flyway:
    enabled: true
    schemas: subscription
    locations: classpath:db/migration
    baseline-on-migrate: true
    create-schemas: true
  kafka:
    bootstrap-servers: localhost:9092

eureka:
  client:
    service-url:
      defaultZone: http://eureka:eurekaSecret@localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: false
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.farm2home.subscription: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
