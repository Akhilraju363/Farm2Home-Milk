server:
  port: 8089

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://localhost:5432/farm2home?currentSchema=inventory
    username: farm2home
    password: farm2home@123
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: inventory
  flyway:
    enabled: true
    schemas: inventory
    create-schemas: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka%40secret@localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.farm2home.inventory: DEBUG
