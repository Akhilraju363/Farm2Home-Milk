server:
  port: 8093

spring:
  application:
    name: reports-service

eureka:
  client:
    service-url:
      defaultZone: http://eureka:eurekaSecret@localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Per-call budget for each downstream report fetch.
reports:
  downstream-timeout-ms: 5000

logging:
  level:
    com.farm2home.reports: DEBUG
