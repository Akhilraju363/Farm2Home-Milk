server:
  port: 8092

spring:
  application:
    name: dashboard-service

eureka:
  client:
    service-url:
      defaultZone: http://eureka:eurekaSecret@localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Per-call budget for each downstream summary fetch - a dashboard must never hang waiting
# on one slow service; a timed-out metric degrades to a fallback value instead (see
# DashboardServiceImpl), so the page still renders everything else.
dashboard:
  downstream-timeout-ms: 3000

logging:
  level:
    com.farm2home.dashboard: DEBUG
