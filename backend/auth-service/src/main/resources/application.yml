server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/farm2home?currentSchema=auth
    username: farm2home
    password: farm2home@123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: auth
        format_sql: true
  flyway:
    enabled: true
    schemas: auth
    locations: classpath:db/migration
    baseline-on-migrate: true
    create-schemas: true
  kafka:
    bootstrap-servers: localhost:9092

eureka:
  client:
    service-url:
      defaultZone: http://eureka:eurekaSecret@localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: false
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:ZmFybTJob21lLXNlY3JldC1rZXktbXVzdC1iZS1hdC1sZWFzdC0yNTYtYml0cy1sb25n}
  expiration: 86400000        # 24h in ms
  refresh-expiration: 604800000 # 7d in ms

sms:
  # logging (default, no external calls/credentials — used by every automated test) | a future
  # real provider's own property value.
  provider: ${SMS_PROVIDER:logging}
  max-attempts: ${SMS_MAX_ATTEMPTS:3}
  retry-backoff-millis: ${SMS_RETRY_BACKOFF_MILLIS:150}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.farm2home.auth: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
