spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/farm2home?currentSchema=auth
    username: ${DB_USERNAME:farm2home}
    password: ${DB_PASSWORD:farm2home@123}
  flyway:
    schemas: auth
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

eureka:
  client:
    service-url:
      defaultZone: http://eureka:eurekaSecret@discovery-service:8761/eureka

configserver:
  health:
    url: http://config-server:8888

jwt:
  secret: ${JWT_SECRET}

sms:
  provider: ${SMS_PROVIDER:logging}
  max-attempts: ${SMS_MAX_ATTEMPTS:3}
  retry-backoff-millis: ${SMS_RETRY_BACKOFF_MILLIS:150}

otp:
  expiry-seconds: ${OTP_EXPIRY_SECONDS:300}
  max-attempts: ${OTP_MAX_ATTEMPTS:5}
  resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:30}
  max-resends: ${OTP_MAX_RESENDS:3}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env

logging:
  level:
    com.farm2home: INFO
