spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/farm2home?currentSchema=notification
    username: ${DB_USERNAME:farm2home}
    password: ${DB_PASSWORD:farm2home@123}
  flyway:
    schemas: notification
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000

app:
  mail:
    from: ${MAIL_FROM:no-reply@farm2homemilk.example}

sms:
  provider: ${SMS_PROVIDER:logging}
  max-attempts: ${SMS_MAX_ATTEMPTS:3}
  retry-backoff-millis: ${SMS_RETRY_BACKOFF_MILLIS:150}

push:
  provider: ${PUSH_PROVIDER:logging}
  max-attempts: ${PUSH_MAX_ATTEMPTS:3}
  retry-backoff-millis: ${PUSH_RETRY_BACKOFF_MILLIS:150}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://eureka:eurekaSecret@discovery-service:8761/eureka}

configserver:
  health:
    url: http://config-server:8888

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env
  health:
    mail:
      enabled: false

logging:
  level:
    com.farm2home: INFO
