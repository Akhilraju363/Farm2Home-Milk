server:
  port: 8090

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/farm2home?currentSchema=notification
    username: farm2home
    password: farm2home@123
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: notification
  flyway:
    enabled: true
    schemas: notification
    create-schemas: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
  # Mailtrap sandbox by default (safe for dev - emails never leave the sandbox inbox).
  # Swap MAIL_HOST/MAIL_PORT for smtp.gmail.com:587 + an app password to use real Gmail SMTP.
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000

app:
  mail:
    from: ${MAIL_FROM:no-reply@farm2homemilk.example}

# email.enabled=false (default) selects the safe logging-only provider - matches sms.provider/
# push.provider's "logging by default" convention, so local dev/CI never attempts a real SMTP
# handshake to the Mailtrap sandbox host above unless explicitly opted in.
email:
  enabled: ${EMAIL_ENABLED:false}
  provider: ${EMAIL_PROVIDER:smtp}
  from-name: ${EMAIL_FROM_NAME:Farm2Home}
  max-attempts: ${EMAIL_MAX_ATTEMPTS:3}
  retry-backoff-millis: ${EMAIL_RETRY_BACKOFF_MILLIS:150}

sms:
  provider: ${SMS_PROVIDER:logging}
  max-attempts: ${SMS_MAX_ATTEMPTS:3}
  retry-backoff-millis: ${SMS_RETRY_BACKOFF_MILLIS:150}

push:
  # logging (default, no external calls/credentials — used by every automated test) | a future
  # real provider's own property value.
  provider: ${PUSH_PROVIDER:logging}
  max-attempts: ${PUSH_MAX_ATTEMPTS:3}
  retry-backoff-millis: ${PUSH_RETRY_BACKOFF_MILLIS:150}

eureka:
  client:
    service-url:
      defaultZone: http://eureka:eurekaSecret@localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.farm2home.notification: DEBUG
