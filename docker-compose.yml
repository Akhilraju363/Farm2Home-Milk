version: '3.9'

services:

  # ─── Infrastructure ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: farm2home-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-farm2home}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farm2home@123}
      POSTGRES_DB: ${POSTGRES_DB:-farm2home}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - farm2home-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farm2home"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: farm2home-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - farm2home-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: farm2home-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - farm2home-network

  redis:
    image: redis:7-alpine
    container_name: farm2home-redis
    ports:
      - "6379:6379"
    networks:
      - farm2home-network

  # ─── Spring Cloud Services ─────────────────────────────────────
  discovery-service:
    build: ./backend/discovery-service
    container_name: farm2home-discovery
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_USERNAME: ${EUREKA_USERNAME:-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-eurekaSecret}
      LOGGING_FILE_PATH: /var/log/farm2home
    volumes:
      - ./logs:/var/log/farm2home
    networks:
      - farm2home-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  config-server:
    build: ./backend/config-server
    container_name: farm2home-config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: docker,native
      CONFIG_USERNAME: ${CONFIG_USERNAME:-configuser}
      CONFIG_PASSWORD: ${CONFIG_PASSWORD:-config@secret}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:eurekaSecret@discovery-service:8761/eureka
      LOGGING_FILE_PATH: /var/log/farm2home
    volumes:
      - ./logs:/var/log/farm2home
    depends_on:
      discovery-service:
        condition: service_started
    networks:
      - farm2home-network

  # ─── Backend Services ──────────────────────────────────────────
  api-gateway:
    build: ./backend/api-gateway
    container_name: farm2home-api-gateway
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-ZmFybTJob21lLXNlY3JldC1rZXktbXVzdC1iZS1hdC1sZWFzdC0yNTYtYml0cy1sb25n}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:eurekaSecret@discovery-service:8761/eureka
      LOGGING_FILE_PATH: /var/log/farm2home
    volumes:
      - ./logs:/var/log/farm2home
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - farm2home-network

  auth-service:
    build: ./backend/auth-service
    container_name: farm2home-auth-service
    ports:
      - "8091:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/farm2home?currentSchema=auth
      SPRING_DATASOURCE_USERNAME: farm2home
      SPRING_DATASOURCE_PASSWORD: farm2home@123
      JWT_SECRET: ${JWT_SECRET:-ZmFybTJob21lLXNlY3JldC1rZXktbXVzdC1iZS1hdC1sZWFzdC0yNTYtYml0cy1sb25n}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:eurekaSecret@discovery-service:8761/eureka
      LOGGING_FILE_PATH: /var/log/farm2home
      SMS_PROVIDER: ${SMS_PROVIDER:-logging}
      SMS_MAX_ATTEMPTS: ${SMS_MAX_ATTEMPTS:-3}
      SMS_RETRY_BACKOFF_MILLIS: ${SMS_RETRY_BACKOFF_MILLIS:-150}
      OTP_EXPIRY_SECONDS: ${OTP_EXPIRY_SECONDS:-300}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-30}
      OTP_MAX_RESENDS: ${OTP_MAX_RESENDS:-3}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - ./logs:/var/log/farm2home
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - farm2home-network

  customer-service:
    build: ./backend/customer-service
    container_name: farm2home-customer-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/farm2home?currentSchema=customer
      SPRING_DATASOURCE_USERNAME: farm2home
      SPRING_DATASOURCE_PASSWORD: farm2home@123
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:eurekaSecret@discovery-service:8761/eureka
      LOGGING_FILE_PATH: /var/log/farm2home
    volumes:
      - ./logs:/var/log/farm2home
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - farm2home-network

  subscription-service:
    build: ./backend/subscription-service
    container_name: farm2home-subscription-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/farm2home?currentSchema=subscription
      DB_USERNAME: farm2home
      DB_PASSWORD: farm2home@123
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:eurekaSecret@discovery-service:8761/eureka
      LOGGING_FILE_PATH: /var/log/farm2home
    volumes:
      - ./logs:/var/log/farm2home
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - farm2home-network

  order-service:
    build: ./backend/order-service
    container_name: farm2home-order-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/farm2home?currentSchema=order
      DB_USERNAME: farm2home
      DB_PASSWORD: farm2home@123
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:eurekaSecret@discovery-service:8761/eureka
      LOGGING_FILE_PATH: /var/log/farm2home
    volumes:
      - ./logs:/var/log/farm2home
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - farm2home-network

  payment-service:
    build: ./backend/payment-service
    container_name: farm2home-payment-service
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/farm2home?currentSchema=payment
      DB_USERNAME: farm2home
      DB_PASSWORD: farm2home@123
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:eurekaSecret@discovery-service:8761/eureka
      LOGGING_FILE_PATH: /var/log/farm2home
      PAYMENT_GATEWAY_PROVIDER: ${PAYMENT_GATEWAY_PROVIDER:-mock}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    volumes:
      - ./logs:/var/log/farm2home
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - farm2home-network

  delivery-service:
    build: ./backend/delivery-service
    container_name: farm2home-delivery-service
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/farm2home?currentSchema=delivery
      DB_USERNAME: farm2home
      DB_PASSWORD: farm2home@123
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:eurekaSecret@discovery-service:8761/eureka
      LOGGING_FILE_PATH: /var/log/farm2home
    volumes:
      - ./logs:/var/log/farm2home
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - farm2home-network

  farm-service:
    build: ./backend/farm-service
    container_name: farm2home-farm-service
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/farm2home?currentSchema=farm
      DB_USERNAME: farm2home
      DB_PASSWORD: farm2home@123
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:eurekaSecret@discovery-service:8761/eureka
      LOGGING_FILE_PATH: /var/log/farm2home
    volumes:
      - ./logs:/var/log/farm2home
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - farm2home-network

  production-service:
    build: ./backend/production-service
    container_name: farm2home-production-service
    ports:
      - "8088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/farm2home?currentSchema=production
      DB_USERNAME: farm2home
      DB_PASSWORD: farm2home@123
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:eurekaSecret@discovery-service:8761/eureka
      LOGGING_FILE_PATH: /var/log/farm2home
    volumes:
      - ./logs:/var/log/farm2home
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - farm2home-network

  inventory-service:
    build: ./backend/inventory-service
    container_name: farm2home-inventory-service
    ports:
      - "8089:8089"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/farm2home?currentSchema=inventory
      DB_USERNAME: farm2home
      DB_PASSWORD: farm2home@123
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:eurekaSecret@discovery-service:8761/eureka
      LOGGING_FILE_PATH: /var/log/farm2home
    volumes:
      - ./logs:/var/log/farm2home
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - farm2home-network

  notification-service:
    build: ./backend/notification-service
    container_name: farm2home-notification-service
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/farm2home?currentSchema=notification
      DB_USERNAME: farm2home
      DB_PASSWORD: farm2home@123
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:eurekaSecret@discovery-service:8761/eureka
      MAIL_HOST: ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@farm2homemilk.example}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Farm2Home}
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-3}
      EMAIL_RETRY_BACKOFF_MILLIS: ${EMAIL_RETRY_BACKOFF_MILLIS:-150}
      LOGGING_FILE_PATH: /var/log/farm2home
      SMS_PROVIDER: ${SMS_PROVIDER:-logging}
      SMS_MAX_ATTEMPTS: ${SMS_MAX_ATTEMPTS:-3}
      SMS_RETRY_BACKOFF_MILLIS: ${SMS_RETRY_BACKOFF_MILLIS:-150}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-logging}
      PUSH_MAX_ATTEMPTS: ${PUSH_MAX_ATTEMPTS:-3}
      PUSH_RETRY_BACKOFF_MILLIS: ${PUSH_RETRY_BACKOFF_MILLIS:-150}
    volumes:
      - ./logs:/var/log/farm2home
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - farm2home-network

  dashboard-service:
    build: ./backend/dashboard-service
    container_name: farm2home-dashboard-service
    ports:
      - "8092:8092"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:eurekaSecret@discovery-service:8761/eureka
      LOGGING_FILE_PATH: /var/log/farm2home
    volumes:
      - ./logs:/var/log/farm2home
    depends_on:
      discovery-service:
        condition: service_healthy
      customer-service:
        condition: service_started
      subscription-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
      delivery-service:
        condition: service_started
      production-service:
        condition: service_started
      inventory-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks:
      - farm2home-network

  reports-service:
    build: ./backend/reports-service
    container_name: farm2home-reports-service
    ports:
      - "8093:8093"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka:eurekaSecret@discovery-service:8761/eureka
      LOGGING_FILE_PATH: /var/log/farm2home
    volumes:
      - ./logs:/var/log/farm2home
    depends_on:
      discovery-service:
        condition: service_healthy
      customer-service:
        condition: service_started
      subscription-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
      delivery-service:
        condition: service_started
      production-service:
        condition: service_started
      inventory-service:
        condition: service_started
      farm-service:
        condition: service_started
    networks:
      - farm2home-network

  # ─── Frontend ─────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: farm2home-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - farm2home-network

volumes:
  postgres_data:

networks:
  farm2home-network:
    driver: bridge
