stages:
  - build
  - test
  - sonar
  - docker-build
  - deploy-qa
  - deploy-uat
  - deploy-prod

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_REGISTRY: $CI_REGISTRY
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

cache:
  paths:
    - .m2/repository/
    - frontend/node_modules/

# ─── Build ────────────────────────────────────────────────────────
build-backend:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd backend
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - backend/*/target/*.jar
    expire_in: 1 hour

build-frontend:
  stage: build
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour

# ─── Test ─────────────────────────────────────────────────────────
test-backend:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  services:
    - postgres:16-alpine
  variables:
    POSTGRES_DB: farm2home_test
    POSTGRES_USER: farm2home
    POSTGRES_PASSWORD: farm2home@123
  script:
    - cd backend
    - mvn test
  artifacts:
    reports:
      junit:
        - backend/*/target/surefire-reports/TEST-*.xml
    paths:
      - backend/*/target/site/jacoco/
    expire_in: 1 hour

test-frontend:
  stage: test
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run test:coverage
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml

# ─── SonarQube ────────────────────────────────────────────────────
sonar-scan:
  stage: sonar
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd backend
    - mvn sonar:sonar
      -Dsonar.projectKey=farm2home-milk
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.token=$SONAR_TOKEN
  only:
    - develop
    - main

# ─── Docker Build ─────────────────────────────────────────────────
.docker-build-template: &docker-build
  stage: docker-build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

docker-build-services:
  <<: *docker-build
  script:
    - |
      for service in api-gateway auth-service customer-service subscription-service order-service payment-service delivery-service farm-service production-service inventory-service notification-service; do
        docker build -t $DOCKER_REGISTRY/farm2home/$service:$IMAGE_TAG ./backend/$service
        docker push $DOCKER_REGISTRY/farm2home/$service:$IMAGE_TAG
      done
    - docker build -t $DOCKER_REGISTRY/farm2home/frontend:$IMAGE_TAG ./frontend
    - docker push $DOCKER_REGISTRY/farm2home/frontend:$IMAGE_TAG
  only:
    - develop
    - main

# ─── Deploy QA ────────────────────────────────────────────────────
deploy-qa:
  stage: deploy-qa
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$QA_SSH_PRIVATE_KEY" | ssh-add -
  script:
    - ssh -o StrictHostKeyChecking=no $QA_USER@$QA_HOST "
        cd /opt/farm2home &&
        docker-compose pull &&
        docker-compose up -d"
  environment:
    name: qa
    url: $QA_URL
  only:
    - develop

# ─── Deploy UAT ───────────────────────────────────────────────────
deploy-uat:
  stage: deploy-uat
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$UAT_SSH_PRIVATE_KEY" | ssh-add -
  script:
    - ssh -o StrictHostKeyChecking=no $UAT_USER@$UAT_HOST "
        cd /opt/farm2home &&
        docker-compose pull &&
        docker-compose up -d"
  environment:
    name: uat
    url: $UAT_URL
  when: manual
  only:
    - main

# ─── Deploy Production ────────────────────────────────────────────
deploy-prod:
  stage: deploy-prod
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$PROD_SSH_PRIVATE_KEY" | ssh-add -
  script:
    - ssh -o StrictHostKeyChecking=no $PROD_USER@$PROD_HOST "
        cd /opt/farm2home &&
        docker-compose pull &&
        docker-compose up -d"
  environment:
    name: production
    url: $PROD_URL
  when: manual
  only:
    - main
